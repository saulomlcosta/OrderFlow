name: orderflow-load

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: orderflow_load
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow-load
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow_load"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  keycloak-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-load
    tmpfs:
      - /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-load
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/orderflow-realm.json:/opt/keycloak/data/import/orderflow-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
