<header class="app-header">
  <a class="brand" routerLink="/" aria-label="OrderFlow storefront home">
    <span class="brand-mark">OF</span>
    <span>
      <strong>OrderFlow</strong>
      <small>Engineering laboratory</small>
    </span>
  </a>

  <nav aria-label="Primary navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Storefront
    </a>
    @if (auth.isAdministrator()) {
      <a routerLink="/admin/products" routerLinkActive="active">
        Product operations
      </a>
      <a routerLink="/admin/checkouts" routerLinkActive="active">
        Checkout operations
      </a>
    }
    @if (auth.authenticated()) {
      <a routerLink="/account" routerLinkActive="active">My purchases</a>
      <span class="identity">{{ auth.username() }}</span>
      <button type="button" (click)="auth.logout()">Sign out</button>
    } @else {
      <button type="button" (click)="auth.login()">Sign in</button>
    }
  </nav>
</header>

<router-outlet />
