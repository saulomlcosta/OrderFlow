name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: orderflow
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: orderflow-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OrderFlow.slnx

      - name: Build
        run: dotnet build OrderFlow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OrderFlow.slnx --configuration Release --no-build --verbosity normal

      - name: Smoke test PostgreSQL persistence
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5216
        run: |
          dotnet run --project src/OrderFlow.Api/OrderFlow.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/orderflow-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true' EXIT

          if ! curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://localhost:5216/openapi/v1.json > /dev/null; then
            cat /tmp/orderflow-api.log
            exit 1
          fi

          curl --fail \
            --header "Content-Type: application/json" \
            --data '{"name":"CI PostgreSQL Product","price":10.00}' \
            http://localhost:5216/products > /dev/null

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/OrderFlow.Web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/OrderFlow.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

  end-to-end:
    name: End-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/OrderFlow.Web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/OrderFlow.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test purchase journey
        run: npm run test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-diagnostics
          path: |
            src/OrderFlow.Web/playwright-report/
            src/OrderFlow.Web/test-results/
          if-no-files-found: ignore
          retention-days: 7
